name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  syntax:
    name: Syntax check (py_compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: |
          errors=0
          while IFS= read -r -d '' f; do
            if python -m py_compile "$f" 2>/dev/null; then
              echo "  ✅ ${f#./}"
            else
              echo "  ❌ ${f#./}"
              errors=$((errors + 1))
            fi
          done < <(find . -name '*.py' -not -path './.github/*' -print0)
          [ "$errors" -eq 0 ] || { echo "$errors file(s) have syntax errors."; exit 1; }

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check --config .github/ruff.toml --output-format=github .

  conventions:
    name: Repo conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check Python script conventions
        run: |
          errors=0
          while IFS= read -r -d '' f; do
            name="${f#./}"
            issues=""

            # 1) Must use 'python' not 'python3' in usage messages
            #    (windows target)
            if grep -q 'python3 ' "$f" 2>/dev/null; then
              issues="$issues[pýthon3]"
            fi

            # 2) Must have UTF-8 stdout reconfigure if the script prints non-ASCII
            #    (check print statements containing non-ASCII characters)
            if grep -qP 'print\([^)]*[^\x00-\x7F]' "$f" 2>/dev/null; then
              if ! grep -q 'sys.stdout.reconfigure' "$f" 2>/dev/null; then
                issues="$issues[missing UTF-8 reconfigure]"
              fi
            fi

            if [ -n "$issues" ]; then
              echo "  ❌ $name$issues"
              errors=$((errors + 1))
            fi
          done < <(find . -name '*.py' -not -path './.github/*' -print0)

          # 3) Every scripts/ dir should have .env.example if its scripts read env vars
          while IFS= read -r -d '' sk; do
            dir="$(dirname "$sk")"
            if [ -d "$dir/scripts" ]; then
              # Check if any .py in scripts/ uses environment variables
              if grep -qr 'os\.environ\.get\|os\.getenv' "$dir/scripts" 2>/dev/null; then
                if [ ! -f "$dir/scripts/.env.example" ]; then
                  echo "  ❌ $dir/scripts/ reads env vars but missing .env.example"
                  errors=$((errors + 1))
                fi
              fi
            fi
          done < <(find . -name 'SKILL.md' -not -path './.github/*' -print0)

          [ "$errors" -eq 0 ] || { echo "$errors convention violation(s)."; exit 1; }

  skill-structure:
    name: Skill structure validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate skill directory structure and SKILL.md metadata
        run: |
          errors=0
          while IFS= read -r -d '' sk; do
            skill_dir=$(dirname "$sk")
            name="${skill_dir#./}"

            # Check 1: Only SKILL.md and README.md allowed as files in skill root
            while IFS= read -r -d '' f; do
              base=$(basename "$f")
              if [ "$base" != "SKILL.md" ] && [ "$base" != "README.md" ]; then
                echo "  ❌ $name: disallowed file '$base' in skill root"
                errors=$((errors + 1))
              fi
            done < <(find "$skill_dir" -maxdepth 1 -type f -print0 2>/dev/null)

            # Check 2: SKILL.md must have YAML frontmatter with name and description
            if ! head -1 "$sk" 2>/dev/null | grep -q '^---$'; then
              echo "  ❌ $name/SKILL.md: missing YAML frontmatter (must start with '---')"
              errors=$((errors + 1))
            else
              yaml=$(sed -n '/^---$/,/^---$/p' "$sk" | sed '1d;$d')
              if [ -z "$(echo "$yaml" | tr -d '[:space:]')" ]; then
                echo "  ❌ $name/SKILL.md: empty YAML frontmatter"
                errors=$((errors + 1))
              else
                if ! echo "$yaml" | grep -q '^name:'; then
                  echo "  ❌ $name/SKILL.md: missing 'name' in YAML frontmatter"
                  errors=$((errors + 1))
                fi
                if ! echo "$yaml" | grep -q '^description:'; then
                  echo "  ❌ $name/SKILL.md: missing 'description' in YAML frontmatter"
                  errors=$((errors + 1))
                fi
              fi
            fi
          done < <(find . -name 'SKILL.md' -not -path './.github/*' -not -path './.git/*' -print0)

          [ "$errors" -eq 0 ] || { echo "$errors skill structure violation(s)."; exit 1; }

  ts-check:
    name: TypeScript check (tsc + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install deps and type-check all TS skills
        run: |
          errors=0
          while IFS= read -r -d '' ts; do
            dir="$(dirname "$ts")"
            echo "── ${dir#./}"
            if (cd "$dir" && bun install --no-save >/dev/null 2>&1 && bunx tsc --noEmit); then
              echo "  ✅ ${dir#./}"
            else
              echo "  ❌ ${dir#./}"
              errors=$((errors + 1))
            fi
          done < <(find . -name 'tsconfig.json' -not -path './.github/*' -not -path '*/node_modules/*' -print0)
          [ "$errors" -eq 0 ] || { echo "$errors TS project(s) have type errors."; exit 1; }
      - name: Smoke-test CLI entry points (--help)
        run: |
          errors=0
          while IFS= read -r -d '' f; do
            if head -1 "$f" | grep -q '^#!/usr/bin/env bun'; then
              if bun run "$f" --help >/dev/null 2>&1; then
                echo "  ✅ ${f#./}"
              else
                echo "  ❌ ${f#./} --help failed"
                errors=$((errors + 1))
              fi
            fi
          done < <(find . -name '*.ts' -not -path './.github/*' -not -path '*/node_modules/*' -print0)
          [ "$errors" -eq 0 ] || { echo "$errors TS entry point(s) failed."; exit 1; }

  ts-conventions:
    name: TS conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check TypeScript script conventions
        run: |
          errors=0
          while IFS= read -r -d '' f; do
            name="${f#./}"
            issues=""

            # 1) Must have UTF-8 console support (chcp 65001) if the script prints non-ASCII
            if grep -qP 'console\.(log|error)\([^)]*[^\x00-\x7F]' "$f" 2>/dev/null; then
              if ! grep -q 'chcp 65001' "$f" 2>/dev/null; then
                issues="$issues[missing chcp 65001]"
              fi
            fi

            if [ -n "$issues" ]; then
              echo "  ❌ $name$issues"
              errors=$((errors + 1))
            fi
          done < <(find . -name '*.ts' -not -path './.github/*' -not -path '*/node_modules/*' -print0)

          # 2) Every scripts/ dir should have .env.example if its TS scripts read env vars
          while IFS= read -r -d '' sk; do
            dir="$(dirname "$sk")"
            if [ -d "$dir/scripts" ]; then
              if grep -qr 'process\.env\|Bun\.env' "$dir/scripts" --include='*.ts' 2>/dev/null; then
                if [ ! -f "$dir/scripts/.env.example" ]; then
                  echo "  ❌ $dir/scripts/ reads env vars but missing .env.example"
                  errors=$((errors + 1))
                fi
              fi
            fi
          done < <(find . -name 'SKILL.md' -not -path './.github/*' -print0)

          [ "$errors" -eq 0 ] || { echo "$errors TS convention violation(s)."; exit 1; }

  market-validate:
    name: Plugin & marketplace validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check plugin/skill conventions (names, versions, marketplace sync)
        run: |
          python - <<'PYEOF'
          import json, pathlib, re

          root = pathlib.Path('.')
          errors = []
          skills = sorted(d.name for d in root.iterdir()
                          if d.is_dir() and not d.name.startswith('.') and (d / 'SKILL.md').exists())

          # Per-skill plugin.json: name must match dir, version must be semver
          for s in skills:
              p = root / s / '.claude-plugin' / 'plugin.json'
              if not p.exists():
                  errors.append(f"{s}: missing .claude-plugin/plugin.json")
                  continue
              m = json.loads(p.read_text(encoding='utf-8'))
              if m.get('name') != s:
                  errors.append(f"{s}: plugin.json name '{m.get('name')}' != dir name")
              if not re.fullmatch(r'\d+\.\d+\.\d+', str(m.get('version', ''))):
                  errors.append(f"{s}: version '{m.get('version')}' is not semver")
              # SKILL.md frontmatter metadata.skill_version must match plugin.json version
              fm = (root / s / 'SKILL.md').read_text(encoding='utf-8').split('---', 2)[1]
              ms = re.search(r'(?m)^metadata:\s*\n\s+skill_version:\s*"?([^"\s]+)"?', fm)
              sv = ms.group(1) if ms else None
              if sv != m.get('version'):
                  errors.append(
                      f"{s}: SKILL.md skill_version '{sv}' != plugin.json version '{m.get('version')}'")

          # marketplace.json: plugins[] must match skill dirs 1:1 with valid sources
          mp = root / '.claude-plugin' / 'marketplace.json'
          if not mp.exists():
              errors.append("missing .claude-plugin/marketplace.json")
          else:
              m = json.loads(mp.read_text(encoding='utf-8'))
              listed = sorted(e['name'] for e in m.get('plugins', []))
              if listed != skills:
                  errors.append(f"marketplace plugins {listed} != skill dirs {skills}")
              for e in m.get('plugins', []):
                  if e.get('source') != f"./{e['name']}":
                      errors.append(f"marketplace entry '{e.get('name')}': bad source '{e.get('source')}'")

          if errors:
              for e in errors:
                  print(f"  ❌ {e}")
              raise SystemExit(1)
          print(f"  ✅ {len(skills)} plugin manifests + marketplace OK")
          PYEOF
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin manifests (--strict)
        run: |
          errors=0
          while IFS= read -r -d '' sk; do
            name="${sk#./}"; name="${name%/SKILL.md}"
            if claude plugin validate "$name" --strict; then
              echo "  ✅ $name"
            else
              echo "  ❌ $name"
              errors=$((errors + 1))
            fi
          done < <(find . -name SKILL.md -not -path './.git/*' -print0)
          [ "$errors" -eq 0 ] || { echo "$errors plugin(s) failed validation."; exit 1; }
      - name: Validate marketplace manifest (--strict)
        run: claude plugin validate .claude-plugin/marketplace.json --strict

  skills-install:
    name: npx skills install-all test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install all skills via npx skills (isolated HOME)
        run: |
          export HOME="$(mktemp -d)"
          npx -y skills add "$GITHUB_WORKSPACE" -g -a claude-code -s '*' -y
          echo "--- installed skills ---"
          npx -y skills ls -g
          installed=$(find "$HOME" -path '*/skills/*/SKILL.md' -type f | wc -l)
          expected=$(find . -name SKILL.md -not -path './.git/*' | wc -l)
          echo "installed=$installed expected=$expected"
          [ "$installed" -eq "$expected" ] || { echo "installed skill count mismatch ($installed != $expected)"; exit 1; }
