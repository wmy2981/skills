target-version = "py310"

[lint]
select = ["F", "E", "W", "I", "N", "UP"]
ignore = ["E501"]

[lint.per-file-ignores]
# E402: module-import-not-at-top-of-file
# fun-asr and freshrss have reconfigure between stdlib and third-party imports
"fun-asr/scripts/fun_asr_cli.py" = ["E402"]
"freshrss/scripts/freshrss.py" = ["E402"]
